<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RChain Sentinel — Causality Explorer</title><style>:root{color-scheme:dark;font-family:Inter,system-ui,sans-serif;background:#05080d;color:#e8f0f8}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% -15%,#193b58 0,#05080d 48%)}main{max-width:1500px;margin:auto;padding:34px 28px 50px}.top{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:28px}.eyebrow{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:#7590a7}.title{font-size:34px;font-weight:900;letter-spacing:-.05em;margin-top:7px}.sub{font-size:12px;color:#8194a7;margin-top:7px}.badge{border:1px solid #6b5227;background:#171208;color:#f2c56e;border-radius:999px;padding:8px 12px;font-size:10px;font-weight:800;letter-spacing:.08em}.controls{display:flex;gap:8px;margin-bottom:20px}.controls input{flex:1;background:#09111a;border:1px solid #213447;border-radius:9px;color:#e8f0f8;padding:11px 13px;font:12px ui-monospace,monospace}.controls button{background:#102337;border:1px solid #31516d;color:#dcecff;border-radius:9px;padding:10px 16px;font-weight:800;cursor:pointer}.rail{position:relative;display:grid;grid-template-columns:repeat(7,1fr);gap:10px;padding:22px 0 8px}.rail:before{content:"";position:absolute;left:5%;right:5%;top:62px;height:2px;background:linear-gradient(90deg,#315b7d,#74bfff,#315b7d);opacity:.55}.node{position:relative;z-index:1;min-height:145px;padding:16px 13px;border:1px solid #203244;border-radius:13px;background:linear-gradient(145deg,#0b141e,#081018);box-shadow:0 12px 35px #0005;transition:.25s transform,.25s border-color,.25s box-shadow}.node:hover{transform:translateY(-5px);border-color:#4b7799;box-shadow:0 18px 45px #0008}.dot{width:17px;height:17px;border-radius:50%;margin:8px auto 18px;background:#78bfff;box-shadow:0 0 0 5px #78bfff18,0 0 22px #78bfff88}.node.live .dot{animation:pulse 1.6s infinite}.kind{font-size:9px;color:#688197;text-transform:uppercase;letter-spacing:.12em}.name{font-size:14px;font-weight:850;margin-top:5px}.id{font:10px ui-monospace,monospace;color:#8ca5ba;margin-top:10px;word-break:break-word}.claim{font-size:10px;line-height:1.45;color:#72879a;margin-top:9px}.detail{margin-top:18px;display:grid;grid-template-columns:1.25fr .75fr;gap:14px}.panel{background:#09111a;border:1px solid #1b2b3a;border-radius:13px;padding:18px}.panel h2{font-size:13px;margin:0 0 12px}.hash{font:11px ui-monospace,monospace;color:#9bc6e8;word-break:break-all;padding:11px;background:#060b11;border-radius:8px}.rows{display:grid;gap:7px}.row{display:flex;justify-content:space-between;gap:14px;border-bottom:1px solid #152330;padding:8px 0;font-size:11px}.row span:first-child{color:#667d91}.row span:last-child{font-family:ui-monospace,monospace;text-align:right;color:#b8ccdc}.note{font-size:10px;line-height:1.6;color:#708497}.status{color:#91e1a5;font-weight:850}.error{color:#ff8b8b}@keyframes pulse{0%,100%{box-shadow:0 0 0 5px #78bfff18,0 0 18px #78bfff66}50%{box-shadow:0 0 0 10px #78bfff08,0 0 32px #78bfffaa}}@media(max-width:1050px){.rail{grid-template-columns:repeat(4,1fr)}.rail:before{display:none}.detail{grid-template-columns:1fr}}@media(max-width:650px){main{padding:22px 14px}.top{align-items:flex-start;flex-direction:column}.title{font-size:27px}.rail{grid-template-columns:1fr 1fr}.controls{flex-direction:column}}</style></head><body><main><header class="top"><div><div class="eyebrow">RChain Reality Compiler</div><div class="title">Causality Explorer</div><div class="sub">Trace one event across logic, execution, block evidence, observation, and verification.</div></div><div class="badge">SYNTHETIC PROVENANCE</div></header><div class="controls"><input id="event" value="demo-7A91" aria-label="Event ID"><button onclick="loadEvent()">Trace Event →</button></div><section id="rail" class="rail"></section><section class="detail"><div class="panel"><h2>Selected Evidence Link</h2><div id="hash" class="hash">Select a stage</div><div id="rows" class="rows"></div></div><div class="panel"><h2>Verification Basis</h2><div id="basis" class="note">Loading…</div></div></section></main><script>let envelope=null;const esc=s=>String(s??'—').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function loadEvent(){const id=document.getElementById('event').value.trim()||'demo-7A91';try{const r=await fetch('/api/reality/event/'+encodeURIComponent(id));if(!r.ok)throw Error(r.status);envelope=await r.json();render()}catch(e){document.getElementById('basis').innerHTML='<span class="error">Unable to load provenance envelope.</span>'}}function render(){const links=envelope.links||[];document.getElementById('rail').innerHTML=links.map((l,i)=>`<article class="node ${i===links.length-1?'live':''}" onclick="selectLink(${i})"><div class="dot"></div><div class="kind">${esc(l.kind)}</div><div class="name">${esc(label(l.kind))}</div><div class="id">${esc(l.id)}</div><div class="claim">${esc(l.claim)}</div></article>`).join('');document.getElementById('basis').textContent=envelope.verification_basis||'—';selectLink(0)}function label(k){return ({event:'Origin Event',qlf:'QLF / ZFA',rholang:'Rholang Process',execution:'ρ-Calculus Execution',block:'RChain Block',observation:'Sentinel Observation',verification:'Sovereign Lattice'})[k]||k}function selectLink(i){const l=envelope?.links?.[i];if(!l)return;document.getElementById('hash').textContent=l.content_hash;document.getElementById('rows').innerHTML=[['Stage',label(l.kind)],['ID',l.id],['Parent',l.parent_id||'root'],['Source',l.source],['Synthetic',l.synthetic?'YES':'NO'],['Claim',l.claim]].map(([a,b])=>`<div class="row"><span>${esc(a)}</span><span>${esc(b)}</span></div>`).join('')}loadEvent();</script></body></html>
