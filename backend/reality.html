<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RChain Reality Compiler — Causality Explorer</title><style>:root{color-scheme:dark;font-family:Inter,system-ui,sans-serif;background:#05080d;color:#e8f0f8}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% -15%,#193b58 0,#05080d 48%)}main{max-width:1500px;margin:auto;padding:30px 26px 50px}.top{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:22px}.eyebrow{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:#7590a7}.title{font-size:34px;font-weight:900;letter-spacing:-.05em;margin-top:7px}.sub{font-size:12px;color:#8194a7;margin-top:7px}.badge{border:1px solid #6b5227;background:#171208;color:#f2c56e;border-radius:999px;padding:8px 12px;font-size:10px;font-weight:800;letter-spacing:.08em}.tabs{display:flex;gap:8px;margin-bottom:14px}.tab{background:#09131d;border:1px solid #20364a;color:#91a8bc;border-radius:9px;padding:9px 13px;font-size:11px;font-weight:800;cursor:pointer}.tab.active{color:#e5f3ff;border-color:#4b7698;background:#102337}.view{display:none}.view.active{display:block}.controls{display:flex;gap:8px;margin-bottom:18px}.controls input{flex:1;background:#09111a;border:1px solid #213447;border-radius:9px;color:#e8f0f8;padding:11px 13px;font:12px ui-monospace,monospace}.controls button{background:#102337;border:1px solid #31516d;color:#dcecff;border-radius:9px;padding:10px 16px;font-weight:800;cursor:pointer}.rail{position:relative;display:grid;grid-template-columns:repeat(7,1fr);gap:10px;padding:20px 0 8px}.rail:before{content:"";position:absolute;left:5%;right:5%;top:60px;height:2px;background:linear-gradient(90deg,#315b7d,#74bfff,#315b7d);opacity:.55}.node{position:relative;z-index:1;min-height:145px;padding:15px 12px;border:1px solid #203244;border-radius:13px;background:linear-gradient(145deg,#0b141e,#081018);box-shadow:0 12px 35px #0005;transition:.25s transform,.25s border-color,.25s box-shadow}.node:hover{transform:translateY(-5px);border-color:#4b7799}.dot{width:17px;height:17px;border-radius:50%;margin:8px auto 17px;background:#78bfff;box-shadow:0 0 0 5px #78bfff18,0 0 22px #78bfff88}.node.live .dot{animation:pulse 1.6s infinite}.kind{font-size:9px;color:#688197;text-transform:uppercase;letter-spacing:.12em}.name{font-size:14px;font-weight:850;margin-top:5px}.id{font:10px ui-monospace,monospace;color:#8ca5ba;margin-top:10px;word-break:break-word}.claim{font-size:10px;line-height:1.45;color:#72879a;margin-top:9px}.detail{margin-top:18px;display:grid;grid-template-columns:1.25fr .75fr;gap:14px}.panel{background:#09111a;border:1px solid #1b2b3a;border-radius:13px;padding:18px}.panel h2{font-size:13px;margin:0 0 12px}.hash{font:11px ui-monospace,monospace;color:#9bc6e8;word-break:break-all;padding:11px;background:#060b11;border-radius:8px}.rows{display:grid;gap:7px}.row{display:flex;justify-content:space-between;gap:14px;border-bottom:1px solid #152330;padding:8px 0;font-size:11px}.row span:first-child{color:#667d91}.row span:last-child{font-family:ui-monospace,monospace;text-align:right;color:#b8ccdc}.note{font-size:10px;line-height:1.6;color:#708497}.diff-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.diff-card{background:#09111a;border:1px solid #1b2b3a;border-radius:13px;padding:15px}.diff-card h3{font-size:12px;margin:0 0 12px}.diff-stage{display:grid;grid-template-columns:1fr 1fr;gap:7px}.cell{padding:10px;border:1px solid #182a39;border-radius:9px;background:#070d14}.cell.same{border-color:#28506a}.cell.changed{border-color:#765b2b;background:#171108;animation:flash .9s ease-in-out}.cell b{display:block;font-size:10px;margin-bottom:5px}.cell span{font:9px ui-monospace,monospace;color:#8198aa;word-break:break-word}.divergence{margin:14px 0;padding:14px;border:1px solid #765b2b;background:#171108;border-radius:11px}.divergence strong{display:block;color:#f2c56e;font-size:12px}.divergence span{display:block;color:#a9916b;font-size:10px;margin-top:5px;line-height:1.5}.error{color:#ff8b8b}@keyframes pulse{0%,100%{box-shadow:0 0 0 5px #78bfff18,0 0 18px #78bfff66}50%{box-shadow:0 0 0 10px #78bfff08,0 0 32px #78bfffaa}}@keyframes flash{0%,100%{transform:scale(1)}50%{transform:scale(1.018)}}@media(max-width:1050px){.rail{grid-template-columns:repeat(4,1fr)}.rail:before{display:none}.detail,.diff-grid{grid-template-columns:1fr}}@media(max-width:650px){main{padding:22px 14px}.top{align-items:flex-start;flex-direction:column}.title{font-size:27px}.rail{grid-template-columns:1fr 1fr}.controls{flex-direction:column}.diff-stage{grid-template-columns:1fr}}</style></head><body><main><header class="top"><div><div class="eyebrow">RChain Reality Compiler</div><div class="title">Causality Explorer</div><div class="sub">Trace reality, then diff two executions down to the first divergent evidence link.</div></div><div class="badge">SYNTHETIC PROVENANCE</div></header><div class="tabs"><button id="tabTrace" class="tab active" onclick="switchView('trace')">Causality Trace</button><button id="tabDiff" class="tab" onclick="switchView('diff')">Reality Diff</button></div><section id="trace" class="view active"><div class="controls"><input id="event" value="demo-7A91" aria-label="Event ID"><button onclick="loadEvent()">Trace Event →</button></div><section id="rail" class="rail"></section><section class="detail"><div class="panel"><h2>Selected Evidence Link</h2><div id="hash" class="hash">Select a stage</div><div id="rows" class="rows"></div></div><div class="panel"><h2>Verification Basis</h2><div id="basis" class="note">Loading…</div></div></section></section><section id="diff" class="view"><div class="controls"><input id="left" value="reality-A" aria-label="Left execution"><input id="right" value="reality-B" aria-label="Right execution"><button onclick="loadDiff()">Compare Reality ⇄</button></div><div id="diffResult" class="note">Choose two executions to reveal their semantic divergence.</div></section></main><script>let envelope=null;const esc=s=>String(s??'—').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const label=k=>({event:'Origin Event',qlf:'QLF / ZFA',rholang:'Rholang Process',execution:'ρ-Calculus Execution',block:'RChain Block',observation:'Sentinel Observation',verification:'Sovereign Lattice'})[k]||k;function switchView(v){document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));document.getElementById(v).classList.add('active');document.getElementById(v==='trace'?'tabTrace':'tabDiff').classList.add('active');if(v==='diff')loadDiff()}async function loadEvent(){const id=document.getElementById('event').value.trim()||'demo-7A91';try{const r=await fetch('/api/reality/event/'+encodeURIComponent(id));if(!r.ok)throw Error(r.status);envelope=await r.json();render()}catch(e){document.getElementById('basis').innerHTML='<span class="error">Unable to load provenance envelope.</span>'}}function render(){const links=envelope.links||[];document.getElementById('rail').innerHTML=links.map((l,i)=>`<article class="node ${i===links.length-1?'live':''}" onclick="selectLink(${i})"><div class="dot"></div><div class="kind">${esc(l.kind)}</div><div class="name">${esc(label(l.kind))}</div><div class="id">${esc(l.id)}</div><div class="claim">${esc(l.claim)}</div></article>`).join('');document.getElementById('basis').textContent=envelope.verification_basis||'—';selectLink(0)}function selectLink(i){const l=envelope?.links?.[i];if(!l)return;document.getElementById('hash').textContent=l.content_hash;document.getElementById('rows').innerHTML=[['Stage',label(l.kind)],['ID',l.id],['Parent',l.parent_id||'root'],['Source',l.source],['Synthetic',l.synthetic?'YES':'NO'],['Claim',l.claim]].map(([a,b])=>`<div class="row"><span>${esc(a)}</span><span>${esc(b)}</span></div>`).join('')}async function loadDiff(){const left=document.getElementById('left').value.trim()||'reality-A',right=document.getElementById('right').value.trim()||'reality-B';try{const r=await fetch('/api/reality/diff/'+encodeURIComponent(left)+'/'+encodeURIComponent(right));if(!r.ok)throw Error(r.status);const d=await r.json();renderDiff(d)}catch(e){document.getElementById('diffResult').innerHTML='<span class="error">Unable to compare provenance envelopes.</span>'}}function renderDiff(d){const stageRows=d.left.links.map((l,i)=>{const r=d.right.links[i];const same=l.content_hash===r.content_hash;return `<div class="cell ${same?'same':'changed'}"><b>${i+1}. ${esc(label(l.kind))}</b><span>${esc(l.id)}<br>${esc(l.content_hash.slice(0,20))}…</span></div><div class="cell ${same?'same':'changed'}"><b>${i+1}. ${esc(label(r.kind))}</b><span>${esc(r.id)}<br>${esc(r.content_hash.slice(0,20))}…</span></div>`}).join('');document.getElementById('diffResult').innerHTML=`<div class="divergence"><strong>FIRST DIVERGENCE · ${esc(d.divergence_stage||'NONE')}</strong><span>${esc(d.divergence_reason||'No divergence detected.')}</span></div><div class="diff-grid"><div class="diff-card"><h3>LEFT · ${esc(d.left_event_id)}</h3><div class="note">Root ${esc(d.left.root_hash.slice(0,28))}…</div></div><div class="diff-card"><h3>RIGHT · ${esc(d.right_event_id)}</h3><div class="note">Root ${esc(d.right.root_hash.slice(0,28))}…</div></div></div><div class="diff-card" style="margin-top:12px"><h3>Semantic Evidence Diff</h3><div class="diff-stage">${stageRows}</div></div><div class="panel" style="margin-top:12px"><div class="note">Common provenance prefix: <b>${d.common_prefix}</b> stage(s). Hash comparison is synthetic and deterministic; it is not a live replay or finality proof.</div></div>`}loadEvent();</script></body></html>
